name: nanobot-bridge-tg
services:
  gateway:
    image: ${BRIDGE_IMAGE:?Set BRIDGE_IMAGE to a verified release image}
    user: "${BRIDGE_UID:-1001}:${BRIDGE_GID:-1001}"
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      NANOBOT_CHECKOUT_DIR: ${BRIDGE_CHECKOUT_DIR:?Set BRIDGE_CHECKOUT_DIR}
    ports:
      - "127.0.0.1:${BRIDGE_WEB_PORT:-8765}:8765"
      - "127.0.0.1:${BRIDGE_HEALTH_PORT:-18790}:18790"
    volumes:
      - "${BRIDGE_DATA_DIR:?Set BRIDGE_DATA_DIR}:/data"
      - type: bind
        source: ${BRIDGE_CHECKOUT_DIR:?Set BRIDGE_CHECKOUT_DIR}
        target: ${BRIDGE_CHECKOUT_DIR}
        read_only: true
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
