name: Bridge Deploy

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Bridge Release workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bridge-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Verify selected release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RELEASE_RUN_ID" > "$RUNNER_TEMP/release-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-run.json').read_text())
          assert run['path'] == '.github/workflows/bridge-release.yml'
          assert run['conclusion'] == 'success' and run['head_branch'] == 'main'
          assert run['event'] == 'workflow_run'
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          PY
      - uses: actions/download-artifact@v4
        with:
          name: bridge-release-linux-arm64
          path: release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Configure deployment-only SSH identity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/bridge-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Transfer verified bundle and deploy through restricted receiver
        working-directory: release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          sha256sum --check SHA256SUMS
          tar -cf - release.json SHA256SUMS image.tar.gz nanobot_ai-*.whl |
            ssh -T -i "$HOME/.ssh/bridge-deploy" -o IdentitiesOnly=yes \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=20 -o ServerAliveCountMax=30 \
              "$DEPLOY_USER@$DEPLOY_HOST"
